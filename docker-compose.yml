services:
  course-api:
    image: course-api
    build:      
      context: .
      dockerfile: src/services/Course/ECourse.Services.Course.API/Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CourseDatabase: >-
        Host=course-database;
        Port=5432;
        Database=ecourse_course;
        Username=postgres;
        Password=A@123_Hgv
    depends_on:
      course-database:
        condition: service_healthy

  course-database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecourse_course
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: A@123_Hgv
    ports:
      - "5433:5432"
    volumes:
      - course-database-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d ecourse_course
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  course-database-data: